services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/projectflow.db
    ports:
      - "8000:8000"
    volumes:
      - projectflow_data:/app/data
    restart: unless-stopped

volumes:
  projectflow_data:
